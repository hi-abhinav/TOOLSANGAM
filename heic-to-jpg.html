<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEIC to JPG Converter</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
<div class="bg-white w-full max-w-xl rounded-2xl shadow-xl p-6 text-center">
<h1 class="text-2xl font-bold mb-2">HEIC to JPG</h1>
<p class="text-gray-500 text-sm mb-6">100% Offline in Browser - Photo server pe nahi jayegi</p>
<input type="file" id="fileInput" accept=".heic,.heif" hidden>
<button onclick="document.getElementById('fileInput').click()" class="w-full bg-black text-white py-3 rounded-xl font-bold">Select HEIC File</button>
<div id="status" class="mt-4 text-sm text-gray-600"></div>
<img id="preview" class="mt-4 hidden w-full rounded-xl">
<a id="downloadBtn" class="hidden mt-4 inline-block bg-green-600 text-white px-6 py-3 rounded-xl font-bold">Download JPG</a>
</div>
<script>
document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const status = document.getElementById('status');
  status.textContent = 'Converting in your Chrome... 100% client side';
  try{
    const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.9 });
    const url = URL.createObjectURL(blob);
    document.getElementById('preview').src = url;
    document.getElementById('preview').classList.remove('hidden');
    const dl = document.getElementById('downloadBtn');
    dl.href = url;
    dl.download = file.name.replace(/\.heic$/i,'') + '.jpg';
    dl.classList.remove('hidden');
    status.textContent = 'Ho gaya! Server cost = 0';
  }catch(err){
    status.textContent = 'Error: Ye valid HEIC nahi hai - ' + err.message;
  }
});
</script>
</body>
</html>
</body>
</html>
