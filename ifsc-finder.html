<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFSC Finder - All Banks</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 p-4 flex justify-center"><div class="bg-white w-full max-w-3xl rounded-2xl shadow-xl p-6">
<h1 class="text-2xl font-bold text-center">Find ANY IFSC Code</h1>
<p class="text-center text-xs text-gray-500 mb-4">Sare 1.5 lakh codes - Server Cost 0</p>

<div class="grid grid-cols-2 gap-3">
<select id="bank" class="border-2 rounded-xl p-3 col-span-2"></select>
<input id="state" placeholder="State - BIHAR" class="border-2 rounded-xl p-3">
<input id="dist" placeholder="District - MADHEPURA" class="border-2 rounded-xl p-3">
<input id="branch" placeholder="Branch - ARAR" class="border-2 rounded-xl p-3 col-span-2">
</div>
<button onclick="doSearch()" class="w-full mt-4 bg-black text-white py-3 rounded-xl font-bold">Search IFSC</button>
<p id="status" class="text-center text-xs text-gray-500 mt-2">Ready</p>
<div id="results" class="mt-4 space-y-3"></div>
</div>

<script>
const BANK_MAP = {"STATE BANK OF INDIA":"SBIN","SBI":"SBIN","PUNJAB NATIONAL BANK":"PUNB","PNB":"PUNB","BANK OF BARODA":"BARB","BOB":"BARB","HDFC BANK":"HDFC","ICICI BANK":"ICIC","AXIS BANK":"UTIB","KOTAK MAHINDRA BANK":"KKBK","CANARA BANK":"CNRB","UNION BANK OF INDIA":"UBIN","BANK OF INDIA":"BKID","INDIAN BANK":"IDIB","CENTRAL BANK OF INDIA":"CBIN","INDIAN OVERSEAS BANK":"IOBA","UCO BANK":"UCBA","BANK OF MAHARASHTRA":"MAHB","IDBI BANK":"IBKL","YES BANK":"YESB","IDFC FIRST BANK":"IDFB","INDUSIND BANK":"INDB","FEDERAL BANK":"FDRL","SOUTH INDIAN BANK":"SIBL","KARNATAKA BANK":"KARB","KARUR VYSYA BANK":"KVBL","CITY UNION BANK":"CIUB","RBL BANK":"RATN","JAMMU & KASHMIR BANK":"JAKA","BANDHAN BANK":"BDBL"};

const bankSel = document.getElementById('bank');
bankSel.innerHTML = '<option value="">Select Bank</option>' + Object.keys(BANK_MAP).map(k=>`<option value="${BANK_MAP[k]}">${k}</option>`).join('');
bankSel.value="SBIN"; // default SBI

let cache = {};
async function loadBankFile(code){
  if(cache[code]) return cache[code];
  document.getElementById('status').innerText = `Loading ${code}.json in your browser...`;
  // Razorpay ka har bank ka alag file hai, 200KB ka, CORS allowed
  const urls = [
    `https://cdn.jsdelivr.net/gh/razorpay/ifsc@master/src/${code}.json`,
    `https://raw.githubusercontent.com/razorpay/ifsc/master/src/${code}.json`
  ];
  for(let url of urls){
    try{
      const r = await fetch(url);
      if(!r.ok) continue;
      const j = await r.json();
      cache[code]=j;
      document.getElementById('status').innerText = `${Object.keys(j).length} branches loaded for ${code}`;
      return j;
    }catch(e){}
  }
  throw new Error('load fail');
}

async function doSearch(){
  const code = bankSel.value;
  const s = document.getElementById('state').value.toLowerCase();
  const d = document.getElementById('dist').value.toLowerCase();
  const b = document.getElementById('branch').value.toLowerCase();
  if(!code){ alert('Bank select karo'); return; }
  try{
    const data = await loadBankFile(code);
    const results = Object.entries(data).filter(([ifsc, info])=>{
      const st = (info.STATE||'').toLowerCase();
      const di = (info.DISTRICT||'').toLowerCase();
      const br = (info.BRANCH||'').toLowerCase();
      return (!s || st.includes(s)) && (!d || di.includes(d)) && (!b || br.includes(b));
    }).slice(0,100);

    const div = document.getElementById('results');
    if(!results.length){ div.innerHTML='<p class="text-center text-red-500">Koi IFSC nahi mila - spelling check karo</p>'; return; }
    div.innerHTML = results.map(([ifsc, info])=>`
      <div class="border rounded-xl p-4 bg-gray-50">
        <div class="flex justify-between"><b>${info.BANK} - ${info.BRANCH}</b><span class="bg-black text-white px-2 py-1 rounded text-xs font-mono">${ifsc}</span></div>
        <p class="text-xs text-gray-600 mt-1">${info.ADDRESS||''}, ${info.DISTRICT}, ${info.STATE}</p>
        <button onclick="navigator.clipboard.writeText('${ifsc}')" class="mt-2 border px-3 py-1 rounded-full text-xs">Copy IFSC</button>
      </div>
    `).join('');
    document.getElementById('status').innerText = `${results.length} IFSC found for ${code} - Server Cost 0`;
  }catch(e){
    document.getElementById('status').innerText = 'Load fail, thoda wait karke retry karo';
  }
}
// Auto-search tumhare screenshot wale case ke liye
document.getElementById('state').value='BIHAR';
document.getElementById('dist').value='MADHEPURA';
document.getElementById('branch').value='ARAR';
</script></body></html>
