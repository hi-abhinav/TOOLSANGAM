<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Bank IFSC Finder - ToolSangam</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 flex justify-center">
<div class="bg-white w-full max-w-3xl rounded-2xl shadow-xl p-6">
<h1 class="text-2xl font-bold text-center">Find ANY IFSC Code</h1>
<p class="text-center text-xs text-gray-500 mb-4">1,50,000+ Codes - 100% Browser me, Server Cost 0</p>

<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<input id="qBank" placeholder="Bank Name - ex: SBI" class="border-2 rounded-xl p-3">
<input id="qState" placeholder="State - ex: Rajasthan" class="border-2 rounded-xl p-3">
<input id="qDistrict" placeholder="District - ex: Kotputli" class="border-2 rounded-xl p-3">
<input id="qBranch" placeholder="Branch - ex: Kotputli" class="border-2 rounded-xl p-3">
</div>
<button onclick="searchIFSC()" class="w-full mt-4 bg-black text-white py-3 rounded-xl font-bold">Search IFSC</button>
<p id="status" class="text-center text-xs text-gray-500 mt-2">Database loading...</p>

<div id="results" class="mt-6 space-y-3"></div>
</div>

<script>
let ALL = [];
// Load full Razorpay IFSC list (compressed) - ~4MB, once per user, cached by browser
async function loadDB(){
  try{
    // This is Razorpay's official full list
    const url = 'https://cdn.jsdelivr.net/gh/razorpay/ifsc@master/dist/IFSC.json';
    const res = await fetch(url);
    const json = await res.json();
    ALL = Object.entries(json).map(([ifsc, d])=>({ifsc, ...d}));
    document.getElementById('status').innerText = `Loaded ${ALL.length} IFSC codes in your browser. Ab search karo.`;
  }catch(e){
    document.getElementById('status').innerText = 'DB load fail, refresh karo. (GitHub down hai)';
  }
}
loadDB();

function searchIFSC(){
  const b = document.getElementById('qBank').value.toLowerCase();
  const s = document.getElementById('qState').value.toLowerCase();
  const d = document.getElementById('qDistrict').value.toLowerCase();
  const br = document.getElementById('qBranch').value.toLowerCase();
  
  if(!b && !s && !d && !br){ alert('Kuch to likho'); return; }

  const filtered = ALL.filter(x=>{
    return (!b || x.BANK.toLowerCase().includes(b)) &&
           (!s || x.STATE.toLowerCase().includes(s)) &&
           (!d || x.DISTRICT.toLowerCase().includes(d)) &&
           (!br || x.BRANCH.toLowerCase().includes(br))
  }).slice(0, 50);

  const div = document.getElementById('results');
  if(!filtered.length){ div.innerHTML='<p class="text-center text-red-500">Koi IFSC nahi mila</p>'; return; }

  div.innerHTML = filtered.map(x=>`
    <div class="border-2 rounded-xl p-4 bg-gray-50">
      <div class="flex justify-between items-center">
        <h3 class="font-bold">${x.BANK} - ${x.BRANCH}</h3>
        <span class="bg-black text-white px-3 py-1 rounded-full text-xs font-mono">${x.IFSC}</span>
      </div>
      <p class="text-xs text-gray-600 mt-1">${x.ADDRESS}, ${x.DISTRICT}, ${x.STATE} - ${x.CITY}</p>
      <button onclick="navigator.clipboard.writeText('${x.IFSC}'); this.innerText='Copied!'" class="mt-2 text-xs bg-white border px-3 py-1 rounded-full">Copy IFSC</button>
    </div>
  `).join('');
  document.getElementById('status').innerText = `${filtered.length} results found (from ${ALL.length} codes) - 0 server cost`;
}
</script>
</body>
</html>
</body>
</html>
