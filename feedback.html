<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback - ToolSangam</title>
<style>body{font-family:system-ui;max-width:800px;margin:auto;padding:20px;line-height:1.8} input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px} button{padding:12px 20px;background:#000;color:#fff;border:0;border-radius:8px;cursor:pointer}</style>
</head>
<body>
<h1>Feedback / Suggest a Tool</h1>
<p>ToolSangam is built for YOU. Kaunsa tool chahiye? Kya improve karein? Batao.</p>
<form action="https://formsubmit.co/contact@toolsangam.online" method="POST">
<input type="text" name="name" placeholder="Your Name" required>
<input type="email" name="email" placeholder="Your Email" required>
<textarea name="feedback" rows="5" placeholder="Your feedback or tool idea..." required></textarea>
<button type="submit">Send Feedback</button>
<input type="hidden" name="_subject" value="New Feedback for ToolSangam">
<input type="hidden" name="_captcha" value="false">
</form>
<br><a href="index.html">← Back to Home</a>
</body>
</html>
