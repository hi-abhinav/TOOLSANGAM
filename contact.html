<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - ToolSangam</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Contact Us</h1></header>
<main style="max-width:800px;margin:auto;padding:20px;line-height:1.7">
<p>Have a question, feedback or tool request? We'd love to hear from you.</p>
<p><strong>Email:</strong> contact@toolsangam.online</p>
<p><strong>Location:</strong> Jaipur, Rajasthan, India - 303315</p>
<form action="https://formsubmit.co/contact@toolsangam.online" method="POST" style="display:flex;flex-direction:column;gap:12px;margin-top:20px">
<input type="text" name="name" placeholder="Your Name" required style="padding:10px">
<input type="email" name="email" placeholder="Your Email" required style="padding:10px">
<textarea name="message" placeholder="Your Message" rows="5" required style="padding:10px"></textarea>
<button type="submit" style="padding:12px;background:#000;color:#fff;border:0;border-radius:6px">Send Message</button>
<input type="hidden" name="_captcha" value="false">
</form>
<br><a href="index.html">← Back to Home</a>
</main>
</body>
</html>
